# Each image includes the versioned public-demo bundle. The read-only models/ mounts below are a
# local-development override: retrain on the host, then restart Compose without rebuilding.

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro

  dashboard:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models:ro
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
